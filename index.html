<!doctype html>
<html lang="en" data-theme="nord">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Hot Take</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Your own rules go last, so they win. See styles.css. -->
  <link rel="stylesheet" href="styles.css" />
</head>


<body class="bg-base-100 text-base-content">

  <div class="hero bg-base-200 min-h-screen">
    <div class="hero-content text-center">
      <div class="max-w-md">
        <h1 class="text-5xl font-bold">Hello there</h1>
        <p class="py-6">
          Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
          quasi. In deleniti eaque aut repudiandae et a id nisi.
        </p>
        <button class="btn btn-primary">Get Started</button>
      </div>
    </div>

    <!--
      SWAP THE TAKE FOR YOUR OWN BEFORE STAGE TWO. Every stage from here builds
      on this page, and it is far easier to judge a design when the words are
      ones you actually mean.
    -->

    <!--
      STAGE TWO — the argument, in three cards.
      Container, row, columns. Decide the whole first, then divide it. Three
      reasons, side by side, each one a daisyUI card.

      Build it here.
    -->

    <!--
      STAGE THREE — make it survive a phone.
      Three columns on a laptop is one unreadable column-and-a-bit on a phone.
      Start from the phone case and add the wide case back with a breakpoint
      prefix. Check 380, 768 and full width before you call it done.

      This stage edits stage two rather than adding to it.
    -->

    <!--
      STAGE FOUR — one media query, written by hand.
      The prefixes are a convenience over ordinary CSS. Write one yourself once,
      in styles.css, so the prefix stops being magic.
    -->

    <!--
      FOOTER. Your name, and the credits.
      Every image you add needs its creator, its source and its licence
      recorded here. If you cannot write that line, you do not know whether you
      are allowed to use the image.
    -->
</body>

</html>
